[project]
name = "surveyhub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roman Protasov", email = "rprotasov@catapulto.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
]

[project.scripts]
surveyhub = "surveyhub:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ruff>=0.17.3",
]
